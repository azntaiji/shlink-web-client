name: Publish Steelhead container to GHCR

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing Git tag to build, for example v4.9.0-beta.1'
        required: true
        default: 'v4.9.0-beta.1'
        type: string

# Serialize publishing so channel tags are not updated by concurrent builds.
concurrency:
  group: ghcr-steelhead-publish
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: azntaiji/shlink-web-client

jobs:
  publish:
    if: github.repository == 'azntaiji/shlink-web-client'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Resolve release tag
        id: release
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo 'Expected a release tag such as v4.9.0 or v4.9.0-beta.1' >&2
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Check out the release tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}

      - name: Set up Node for version verification
        uses: actions/setup-node@v6
        with:
          node-version: 26.x

      - name: Verify version and prepare image metadata
        id: image
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          node --input-type=module -e "import pack from './package.json' with { type: 'json' }; if (process.env.RELEASE_VERSION !== pack.version) throw new Error('Git tag must match package.json version');"
          image="${REGISTRY}/${IMAGE_NAME}"
          channel=latest
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            channel=beta
          fi
          {
            echo 'tags<<IMAGE_TAGS'
            echo "${image}:${RELEASE_VERSION}"
            echo "${image}:${channel}"
            echo 'IMAGE_TAGS'
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.release.outputs.version }}
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Steelhead Shlink Web Client
            org.opencontainers.image.source=https://github.com/azntaiji/shlink-web-client
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ steps.image.outputs.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max